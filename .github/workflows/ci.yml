name: CI

on:
  push:
    branches: [master, "rc/*", "pf/*"]
  pull_request:
    branches: [master]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Materialize PF-001B physical corpus
        run: python scripts/materialize_pf001b_physical_corpus.py

      - name: Validate PF-001B physical corpus
        run: python scripts/validate_pf001b_physical_corpus.py

      - name: Validate PF-001C1 metric contract
        run: python scripts/validate_pf001c1_metric_contract.py

      - name: Validate PF-001C1.2 Stage-0 split manifest
        run: python scripts/validate_pf001c1_stage0_split.py

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/

      - name: Type check with mypy
        run: mypy src/

      - name: Run tests
        run: pytest tests/ -v -m "not external_asset" --tb=short

